name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Verify tag matches gem and npm versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gem_version="$(ruby -Ilib -rrails_datepicker/version -e 'print RailsDatepicker::VERSION')"
          npm_version="$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "v${gem_version}" || {
            echo "::error::Tag ${RELEASE_TAG} does not match gem version ${gem_version}"
            exit 1
          }
          test "$gem_version" = "$npm_version" || {
            echo "::error::Gem version ${gem_version} does not match npm version ${npm_version}"
            exit 1
          }
      - run: npm ci
      - run: npm test
      - run: npm run build:css
      - run: bundle exec rake test
      - name: Validate release package
        run: |
          gem build rails-datepicker.gemspec --output /tmp/rails-datepicker.gem
          gem check /tmp/rails-datepicker.gem

  rubygems:
    name: Publish RubyGem
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://rubygems.org/gems/rails-datepicker
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - name: Build and validate gem
        run: |
          version="$(ruby -Ilib -rrails_datepicker/version -e 'print RailsDatepicker::VERSION')"
          mkdir -p pkg
          gem build rails-datepicker.gemspec --output "pkg/rails-datepicker-${version}.gem"
          gem check "pkg/rails-datepicker-${version}.gem"
      - name: Publish to RubyGems
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          test -n "$GEM_HOST_API_KEY" || {
            echo "::error::RUBYGEMS_API_KEY is not configured in the release environment"
            exit 1
          }
          gem push pkg/rails-datepicker-*.gem --host https://rubygems.org </dev/null

  github-release:
    name: Create GitHub release
    needs: rubygems
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - name: Build gem asset
        run: |
          version="$(ruby -Ilib -rrails_datepicker/version -e 'print RailsDatepicker::VERSION')"
          mkdir -p pkg
          gem build rails-datepicker.gemspec --output "pkg/rails-datepicker-${version}.gem"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" pkg/*.gem \
              --verify-tag \
              --generate-notes
          fi
